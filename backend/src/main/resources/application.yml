spring:
  application:
    name: fxai-backend
  jackson:
    time-zone: UTC

fxai:
  market:
    provider: ${FXAI_MARKET_PROVIDER:mock}
    oanda:
      base-url: ${OANDA_BASE_URL:https://api-fxpractice.oanda.com}
      api-token: ${OANDA_API_TOKEN:}
      account-id: ${OANDA_ACCOUNT_ID:}
      connection-timeout: ${OANDA_CONNECTION_TIMEOUT:2s}
      request-timeout: ${OANDA_REQUEST_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
