spring:
  application:
    name: fxai-backend
  datasource:
    url: ${FXAI_DATABASE_URL}
    username: ${FXAI_DATABASE_USERNAME}
    password: ${FXAI_DATABASE_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${FXAI_REDIS_HOST:localhost}
      port: ${FXAI_REDIS_PORT:6379}
      connect-timeout: ${FXAI_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${FXAI_REDIS_TIMEOUT:500ms}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

fxai:
  market:
    provider: ${FXAI_MARKET_PROVIDER:mock}
    price-poll-interval: ${FXAI_PRICE_POLL_INTERVAL:15000}
    latest-price-cache:
      ttl: ${FXAI_LATEST_PRICE_CACHE_TTL:5s}
    oanda:
      base-url: ${OANDA_BASE_URL:https://api-fxpractice.oanda.com}
      api-token: ${OANDA_API_TOKEN:}
      account-id: ${OANDA_ACCOUNT_ID:}
      connection-timeout: ${OANDA_CONNECTION_TIMEOUT:2s}
      request-timeout: ${OANDA_REQUEST_TIMEOUT:5s}
  websocket:
    allowed-origin: ${FXAI_CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
