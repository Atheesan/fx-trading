services:
  database:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_DB: ${FXAI_DATABASE_NAME-fxai}
      POSTGRES_USER: ${FXAI_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${FXAI_DATABASE_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${FXAI_DATABASE_PORT-5433}:5432"
    volumes:
      - fxai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "${FXAI_REDIS_PORT-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  fxai_postgres_data:
